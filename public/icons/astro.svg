<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0d1633"/>
      <stop offset="100%" stop-color="#070c1a"/>
    </radialGradient>
    <filter id="starGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="48" fill="url(#bg)"/>

  <!-- Constellation lines -->
  <g stroke="#0ff3ff" stroke-opacity="0.8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 330 L220 260 L292 290 L350 220 L380 290 L300 360 L210 360 Z" />
    <path d="M220 260 L260 190 L350 220" />
  </g>

  <!-- Stars (white dots) -->
  <g filter="url(#starGlow)">
    <circle cx="160" cy="330" r="8" fill="#ffffff"/>
    <circle cx="220" cy="260" r="10" fill="#ffffff"/>
    <circle cx="292" cy="290" r="7" fill="#ffffff"/>
    <circle cx="350" cy="220" r="11" fill="#ffffff"/>
    <circle cx="380" cy="290" r="8" fill="#ffffff"/>
    <circle cx="300" cy="360" r="10" fill="#ffffff"/>
    <circle cx="210" cy="360" r="7" fill="#ffffff"/>
    <circle cx="260" cy="190" r="9" fill="#ffffff"/>
  </g>

  <!-- Subtle scattered background stars -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="104" cy="148" r="2"/>
    <circle cx="142" cy="110" r="2"/>
    <circle cx="408" cy="150" r="2"/>
    <circle cx="430" cy="120" r="2"/>
    <circle cx="90" cy="420" r="2"/>
    <circle cx="420" cy="420" r="2"/>
    <circle cx="260" cy="420" r="2"/>
  </g>
</svg>

